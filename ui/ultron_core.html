<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:100%; height:100%; overflow:hidden; background:transparent; }
#root { width:100%; height:100%; position:relative; }
canvas { display:block; }
#cam-preview {
  position:absolute; bottom:10px; right:10px;
  width:72px; height:54px; border:1px solid rgba(0,212,255,0.35);
  border-radius:2px; object-fit:cover; opacity:0.55; z-index:5;
  transform:scaleX(-1);
}
.hud-br { position:absolute; width:16px; height:16px; border:1px solid rgba(0,212,255,0.4); z-index:4; }
.hud-br.tl { top:8px; left:8px; border-right:0; border-bottom:0; }
.hud-br.tr { top:8px; right:8px; border-left:0; border-bottom:0; }
.hud-br.bl { bottom:8px; left:8px; border-right:0; border-top:0; }
.hud-br.br { bottom:8px; right:8px; border-left:0; border-top:0; }
.scan-line {
  position:absolute; left:6%; right:6%; height:1px; z-index:3;
  background:linear-gradient(90deg, transparent, rgba(255,170,48,0.55), transparent);
  animation:scan 3.2s linear infinite; opacity:0.45;
}
@keyframes scan { 0%{top:12%;opacity:0} 15%,85%{opacity:0.55} 100%{top:88%;opacity:0} }
#hud-bar {
  position:absolute; left:0; right:0; bottom:0; z-index:6;
  padding:6px 10px 8px;
  background:linear-gradient(transparent, rgba(0,0,0,0.85));
  font-family:'Courier New',monospace;
  font-size:9px; letter-spacing:0.14em; color:rgba(255,170,48,0.85);
  text-transform:uppercase;
  display:flex; justify-content:space-between; align-items:center;
}
#gesture-label { color:#00d4ff; }
#voice-label { color:#ffcc66; max-width:45%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#mic-btn {
  position:absolute; top:10px; right:10px; z-index:7;
  width:34px; height:34px; border-radius:50%;
  border:1px solid rgba(255,170,48,0.45);
  background:rgba(0,0,0,0.55); color:#ffaa30;
  font-size:14px; cursor:pointer;
  box-shadow:0 0 12px rgba(255,170,48,0.15);
}
#mic-btn.listening {
  border-color:#6ee7b7; color:#6ee7b7;
  box-shadow:0 0 20px rgba(110,231,183,0.35);
  animation:micPulse 0.8s ease-in-out infinite;
}
@keyframes micPulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }
</style>
</head>
<body>
<div id="root">
  <div class="scan-line"></div>
  <div class="hud-br tl"></div><div class="hud-br tr"></div>
  <div class="hud-br bl"></div><div class="hud-br br"></div>
  <button id="mic-btn" title="Voice command">🎙</button>
  <video id="cam-preview" autoplay playsinline muted style="display:none;"></video>
  <div id="hud-bar">
    <span id="gesture-label">GESTURE STANDBY</span>
    <span id="voice-label">NEURAL LINK __STATUS__</span>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script type="module">
const ACTIVE = __LLM_ACTIVE__;
const MEMORY = __MEMORY_COUNT__;
const GESTURES = __GESTURES__;
const VOICE = __VOICE__;

const root = document.getElementById("root");
const gestureLabel = document.getElementById("gesture-label");
const voiceLabel = document.getElementById("voice-label");
const micBtn = document.getElementById("mic-btn");
const camPreview = document.getElementById("cam-preview");

let voiceLevel = 0;
let listening = false;
let lastGesture = "";
let lastGestureTime = 0;
let recognition = null;

function sendCommand(cmd, source) {
  try {
    const topWin = window.top || window.parent;
    const url = new URL(topWin.location.href);
    url.searchParams.set("astra_cmd", cmd);
    url.searchParams.set("astra_src", source);
    topWin.location.href = url.toString();
  } catch (err) {
    voiceLabel.textContent = "CMD: " + cmd.slice(0, 28);
  }
}

const GESTURE_MAP = {
  palm: ["help", "PALM DETECTED"],
  point: ["what time is it", "POINT · TIME"],
  pinch: ["show my memory", "PINCH · MEMORY"],
  fist: ["sync my memory", "FIST · SYNC"],
  wave: ["inspire me", "WAVE · INSPIRE"],
  spread: ["organize my morning routine", "SPREAD · MORNING"],
  circle: ["activate coding workspace", "CIRCLE · CODE WS"],
};

function triggerGesture(name) {
  const now = Date.now();
  if (name === lastGesture && now - lastGestureTime < 2500) return;
  lastGesture = name;
  lastGestureTime = now;
  const entry = GESTURE_MAP[name];
  if (!entry) return;
  gestureLabel.textContent = entry[1];
  sendCommand(entry[0], "gesture:" + name);
}

// ——— THREE.JS ORB ———
const w = root.clientWidth || 360;
const h = root.clientHeight || 400;
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(50, w / h, 0.1, 100);
camera.position.set(0, 0.15, 4.1);

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setSize(w, h);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
root.insertBefore(renderer.domElement, root.firstChild);

const C_BRIGHT = 0xffaa30, C_MID = 0xdd7700, C_CYAN = 0x00d4ff;

function lineMat(color, opacity) {
  return new THREE.LineBasicMaterial({
    color, transparent: true, opacity,
    blending: THREE.AdditiveBlending, depthWrite: false,
  });
}

const orb = new THREE.Group();
scene.add(orb);

function wireSphere(r, d, c, o) {
  const g = new THREE.IcosahedronGeometry(r, d);
  return new THREE.LineSegments(new THREE.EdgesGeometry(g), lineMat(c, o));
}

const shell1 = wireSphere(1.05, 2, C_BRIGHT, ACTIVE ? 0.88 : 0.52);
const shell2 = wireSphere(0.8, 1, C_MID, 0.42);
const shell3 = wireSphere(0.55, 1, C_CYAN, 0.32);
orb.add(shell1, shell2, shell3);

const core = new THREE.Mesh(
  new THREE.IcosahedronGeometry(0.2, 0),
  new THREE.MeshBasicMaterial({ color: C_BRIGHT, transparent: true, opacity: 0.85, wireframe: true })
);
orb.add(core);

const ring = new THREE.Mesh(
  new THREE.TorusGeometry(1.32, 0.007, 8, 64),
  new THREE.MeshBasicMaterial({ color: C_BRIGHT, transparent: true, opacity: 0.32, blending: THREE.AdditiveBlending })
);
ring.rotation.x = Math.PI / 2.2;
orb.add(ring);

const pCount = 80 + Math.min(MEMORY * 8, 120);
const pos = new Float32Array(pCount * 3);
for (let i = 0; i < pCount; i++) {
  const r = 1.1 + Math.random() * 1.6;
  const t = Math.random() * Math.PI * 2;
  const p = Math.acos(2 * Math.random() - 1);
  pos[i*3] = r * Math.sin(p) * Math.cos(t);
  pos[i*3+1] = r * Math.sin(p) * Math.sin(t);
  pos[i*3+2] = r * Math.cos(p);
}
const pg = new THREE.BufferGeometry();
pg.setAttribute("position", new THREE.BufferAttribute(pos, 3));
const particles = new THREE.Points(pg, new THREE.PointsMaterial({
  color: C_BRIGHT, size: 0.022, transparent: true, opacity: 0.5,
  blending: THREE.AdditiveBlending, depthWrite: false,
}));
scene.add(particles);

let t = 0;
function animate() {
  requestAnimationFrame(animate);
  const speed = ACTIVE ? 0.013 : 0.007;
  t += speed;
  const pulse = 1 + voiceLevel * 0.35 + Math.sin(t * 3) * (listening ? 0.08 : 0.03);
  orb.rotation.y = t * 0.85;
  orb.rotation.x = Math.sin(t * 0.35) * 0.1;
  shell2.rotation.y = -t * 1.3;
  shell3.rotation.x = t * 1.0;
  core.rotation.y = t * 2.0;
  core.scale.setScalar(pulse);
  orb.scale.setScalar(1 + voiceLevel * 0.12);
  ring.rotation.z = t * 0.3;
  particles.rotation.y = t * 0.12;
  voiceLevel *= 0.88;
  renderer.render(scene, camera);
}
animate();

// ——— VOICE INPUT + PULSE ———
async function setupVoice() {
  if (!VOICE) return;

  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (SR) {
    recognition = new SR();
    recognition.continuous = false;
    recognition.interimResults = true;
    recognition.lang = "en-US";
    recognition.onresult = (e) => {
      let interim = "", final = "";
      for (let i = e.resultIndex; i < e.results.length; i++) {
        const tx = e.results[i][0].transcript;
        if (e.results[i].isFinal) final += tx;
        else interim += tx;
      }
      voiceLabel.textContent = (final || interim || "LISTENING...").slice(0, 40).toUpperCase();
      if (final.trim()) {
        listening = false;
        micBtn.classList.remove("listening");
        sendCommand(final.trim(), "voice");
      }
    };
    recognition.onend = () => {
      listening = false;
      micBtn.classList.remove("listening");
    };
    recognition.onerror = () => {
      listening = false;
      micBtn.classList.remove("listening");
      voiceLabel.textContent = "VOICE ERROR";
    };
  }

  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    const ctx = new (window.AudioContext || window.webkitAudioContext)();
    const analyser = ctx.createAnalyser();
    analyser.fftSize = 256;
    ctx.createMediaStreamSource(stream).connect(analyser);
    const data = new Uint8Array(analyser.frequencyBinCount);
    function tick() {
      analyser.getByteFrequencyData(data);
      let sum = 0;
      for (let i = 0; i < data.length; i++) sum += data[i];
      const avg = sum / data.length / 255;
      if (listening || avg > 0.05) voiceLevel = Math.max(voiceLevel, avg);
      requestAnimationFrame(tick);
    }
    tick();
  } catch (_) {}

  micBtn.onclick = () => {
    if (!recognition) {
      voiceLabel.textContent = "VOICE NOT SUPPORTED";
      return;
    }
    if (listening) {
      recognition.stop();
      return;
    }
    listening = true;
    micBtn.classList.add("listening");
    voiceLabel.textContent = "LISTENING...";
    recognition.start();
  };
}

// ——— MEDIAPIPE GESTURES ———
async function setupGestures() {
  if (!GESTURES) {
    gestureLabel.textContent = "GESTURES OFF";
    return;
  }

  try {
    const { HandLandmarker, FilesetResolver } = await import(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8"
    );
    const vision = await FilesetResolver.forVisionTasks(
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.8/wasm"
    );
    const handLandmarker = await HandLandmarker.createFromOptions(vision, {
      baseOptions: {
        modelAssetPath: "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",
        delegate: "GPU",
      },
      runningMode: "VIDEO",
      numHands: 1,
    });

    const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "user", width: 320, height: 240 } });
    camPreview.srcObject = stream;
    camPreview.style.display = "block";
    gestureLabel.textContent = "TRACKING ACTIVE";

    let lastDetect = 0;
    function detectLoop() {
      if (camPreview.readyState >= 2) {
        const now = performance.now();
        if (now - lastDetect > 120) {
          lastDetect = now;
          const result = handLandmarker.detectForVideo(camPreview, now);
          if (result.landmarks && result.landmarks.length > 0) {
            classifyGesture(result.landmarks[0]);
          }
        }
      }
      requestAnimationFrame(detectLoop);
    }
    detectLoop();
  } catch (err) {
    gestureLabel.textContent = "CAMERA OPTIONAL";
  }
}

function dist(a, b) {
  const dx = a.x - b.x, dy = a.y - b.y, dz = (a.z||0) - (b.z||0);
  return Math.sqrt(dx*dx + dy*dy + dz*dz);
}

function classifyGesture(lm) {
  const thumb = lm[4], index = lm[8], middle = lm[12], ring = lm[16], pinky = lm[20];
  const wrist = lm[0];
  const pinchDist = dist(thumb, index);

  const indexUp = index.y < wrist.y - 0.05;
  const middleUp = middle.y < wrist.y - 0.04;
  const ringUp = ring.y < wrist.y - 0.04;
  const pinkyUp = pinky.y < wrist.y - 0.04;

  if (pinchDist < 0.05) {
    triggerGesture("pinch");
    return;
  }

  if (!indexUp && !middleUp && !ringUp && !pinkyUp) {
    triggerGesture("fist");
    return;
  }

  if (indexUp && !middleUp && !ringUp && !pinkyUp) {
    triggerGesture("point");
    return;
  }

  if (indexUp && middleUp && ringUp && pinkyUp) {
    triggerGesture("palm");
    return;
  }

  if (indexUp && middleUp && !ringUp && !pinkyUp) {
    triggerGesture("spread");
    return;
  }

  const spread = dist(index, pinky);
  if (spread > 0.18 && indexUp && pinkyUp) {
    triggerGesture("wave");
  }
}

setupVoice();
setupGestures();

window.addEventListener("resize", () => {
  const nw = root.clientWidth, nh = root.clientHeight;
  camera.aspect = nw / nh;
  camera.updateProjectionMatrix();
  renderer.setSize(nw, nh);
});
</script>
</body>
</html>
